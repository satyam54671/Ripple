services:
  postgres:
    image: postgres:16-alpine
    container_name: ripple-postgres
    environment:
      POSTGRES_USER: ripple
      POSTGRES_PASSWORD: ripple_dev_password
      POSTGRES_DB: ripple
    ports:
      - "5432:5432"
    volumes:
      - ripple_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripple"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ripple-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ripple:ripple_dev_password@postgres:5432/ripple
      INTEGRATION_MODE: mock
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ripple-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  ripple_pgdata:
